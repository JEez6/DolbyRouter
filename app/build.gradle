plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dolbyrouter'
    buildToolsVersion = "36.1.0"
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.dolbyrouter"
        minSdk 29
        targetSdk 36
        versionCode 200
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 无外部运行时依赖（配置 UI 仅写 SharedPreferences）
}
